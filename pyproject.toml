[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insoiltool"
version = "6.3.26"
description = "Soil analysis and classification tool (USCS, AASHTO, Atterberg limits, grain size, bearing capacity)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["geotechnical", "soil", "classification", "bearing-capacity", "atterberg"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.scripts]
insoiltool = "insoiltool.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["insoiltool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
